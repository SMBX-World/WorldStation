services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: station
      POSTGRES_USER: station
      POSTGRES_PASSWORD: station_password
    ports: ["15432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    image: ghcr.io/smbx-world/worldstation:latest
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/station"
      SPRING_DATASOURCE_USERNAME: "station"
      SPRING_DATASOURCE_PASSWORD: "station_password"
      OAUTH2_CLIENT_ID: "***REMOVED***"
      OAUTH2_CLIENT_SECRET: "***REMOVED***"
      SWAGGER_UI_ENABLED: "true"
      S3_ENDPOINT: "https://s3.example.com"
      S3_REGION: "auto"
      S3_BUCKET: "worldstation"
      S3_PUBLIC_BASE_URL: "https://assets.example.com"
      S3_PATH_STYLE_ACCESS: "false"
      S3_ACCESS_KEY: "***REMOVED***"
      S3_SECRET_KEY: "***REMOVED***"
      S3_SESSION_TOKEN: ""
      S3_WORLDMAP_PREFIX: "station"
      S3_PICBED_PREFIX: "picbed"
    restart: unless-stopped

volumes:
  db_data:
