spring:
  application:
    name: WorldStation
  servlet:
    multipart:
      enabled: true
      max-file-size: 1024MB
      max-request-size: 1024MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    async:
      request-timeout: -1
  web:
    resources:
      static-locations:
        - file:./static/
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/

springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false

server:
  tomcat:
    connection-timeout: 2h
    keep-alive-timeout: 2h
    max-swallow-size: -1

worldstation:
  flarum:
    base-url: ${FLARUM_BASE_URL:https://smbx.world}
    connect-timeout: 5s
    read-timeout: 10s
  auth:
    jwt-secret: ${AUTH_JWT_SECRET:}
    session-ttl: 90d
    cookie-name: ${AUTH_COOKIE_NAME:ws_auth}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    max-login-failures: 10
    failure-window: 10m
  admin:
    ids: [1, 3, 6]
  upload:
    temp-dir: ./upload-tmp
    chunk-size: 8388608
    stream-start-window-chunks: 4
    chunk-wait-timeout-seconds: 60
    session-ttl-hours: 2
    max-active-sessions-per-user: 2
    keep-chunks-until-completed: true
