spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      client:
        registration:
          smbx-world:
            client-id: ${OAUTH2_CLIENT_ID}
            client-secret: ${OAUTH2_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: "user.read"
            redirect-uri: "https://station.smbx.world/login/oauth2/code/{registrationId}"
        provider:
          smbx-world:
            authorization-uri: https://smbx.world/oauth/authorize
            token-uri: https://smbx.world/oauth/token
            user-info-uri: https://smbx.world/api/user
            user-name-attribute: username

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED}
    path: /docs
    csrf:
      enabled: true
      cookie-name: "XSRF-TOKEN"

onedrive:
  alist: ${ONEDRIVE_ALIST}
  alist-token: ${ONEDRIVE_ALIST_TOKEN}
  worldmap-path: /station
  picbed-path: /picbed

worldstation:
  admin:
    ids: [1, 3, 6]
  upload:
    temp-dir: ./upload-tmp
    chunk-size: 8388608
    stream-start-window-chunks: 4
    chunk-wait-timeout-seconds: 60
    session-ttl-hours: 6
    max-active-sessions-per-user: 2
    keep-chunks-until-completed: true
